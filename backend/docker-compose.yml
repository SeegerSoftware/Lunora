services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: elunai
      POSTGRES_PASSWORD: elunai_dev
      POSTGRES_DB: elunai
    ports:
      - "5432:5432"
    volumes:
      - elunai_pg_data:/var/lib/postgresql/data

volumes:
  elunai_pg_data:
